<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTP Security Research Lab</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#edf2f7;
 color:#172033;
}
header{
 background:#172554;
 color:white;
 padding:18px;
 text-align:center;
}
.container{
 max-width:430px;
 margin:25px auto;
 padding:15px;
}
.card{
 background:white;
 border-radius:15px;
 padding:24px;
 box-shadow:0 4px 15px #0002;
}
input{
 width:100%;
 padding:14px;
 margin:10px 0;
 border:1px solid #bbb;
 border-radius:8px;
 font-size:17px;
}
button{
 width:100%;
 padding:14px;
 margin-top:10px;
 border:0;
 border-radius:8px;
 background:#2563eb;
 color:white;
 font-size:16px;
}
.notice{
 background:#fff4ce;
 padding:12px;
 border-radius:8px;
 font-size:13px;
 margin-top:15px;
}
#otpSection{display:none}
#result{margin-top:15px;font-weight:bold}
#timer{color:#64748b;font-size:13px}
footer{text-align:center;padding:20px;color:#64748b}
</style>
</head>

<body>

<header>
<h2>OTP Security Research</h2>
<p>Educational Testing Laboratory</p>
</header>

<div class="container">
<div class="card">

<div id="phoneSection">
<h3>Step 1: Demo Number</h3>
<p>পরীক্ষার জন্য একটি কাল্পনিক নম্বর দিন।</p>

<input id="phone"
placeholder="017XXXXXXXX"
maxlength="11"
inputmode="numeric">

<button onclick="generateOTP()">
Generate Demo OTP
</button>
</div>

<div id="otpSection">
<h3>Step 2: OTP Receiver</h3>

<p>আপনার পরীক্ষামূলক OTP:</p>

<h2 id="demoOTP"
style="text-align:center;color:#087b45;letter-spacing:5px">
</h2>

<input id="otpInput"
placeholder="৬ ডিজিটের OTP"
maxlength="6"
inputmode="numeric">

<p id="timer"></p>

<button onclick="verifyOTP()">
Verify OTP
</button>
</div>

<div id="result"></div>

<div class="notice">
⚠️ এটি একটি শিক্ষামূলক ডেমো।
আসল SMS পাঠানো হয় না।
কোনো ব্যক্তিগত তথ্য সংগ্রহ করা হয় না।
</div>

</div>
</div>

<footer>
Cyber Security Research Project
</footer>

<script>
let currentOTP="";
let startedAt=0;
let expiry;

function generateOTP(){

 const phone=document.getElementById("phone").value;

 if(!/^01[3-9]\d{8}$/.test(phone)){
  showResult("সঠিক ডেমো নম্বরের ফরম্যাট দিন।",false);
  return;
 }

 currentOTP=String(
  Math.floor(100000+Math.random()*900000)
 );

 startedAt=performance.now();

 document.getElementById("demoOTP").textContent=
 currentOTP;

 document.getElementById("phoneSection").style.display="none";
 document.getElementById("otpSection").style.display="block";

 document.getElementById("result").textContent="";

 expiry=Date.now()+120000;
 updateTimer();
}

function updateTimer(){
 const remaining=Math.max(0,Math.ceil((expiry-Date.now())/1000));
 document.getElementById("timer").textContent=
 "Demo OTP মেয়াদ: "+remaining+" সেকেন্ড";

 if(remaining>0){
  setTimeout(updateTimer,1000);
 }
}

function verifyOTP(){

 const entered=document.getElementById("otpInput").value;
 const elapsed=((performance.now()-startedAt)/1000).toFixed(3);

 if(Date.now()>expiry){
  showResult("Demo OTP-এর মেয়াদ শেষ।",false);
  return;
 }

 if(entered===currentOTP){
  showResult("Verification Successful!",true);
  console.log("Demo verified in "+elapsed+" seconds");
 }else{
  showResult("Verification Failed! ভুল OTP।",false);
 }
}

function showResult(message,success){
 const result=document.getElementById("result");
 result.textContent=message;
 result.style.color=success?"green":"red";
}
</script>

</body>
</html>
